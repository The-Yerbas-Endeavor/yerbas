name: Publish verified Ubuntu 26 pruning evidence verifier 619d3fdb
on:
  push:
    branches: ["4.0.1.6"]
    paths:
      - .github/workflows/publish-prune-verify-619d3fdb.yml

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fetch and validate exact successful build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          SHA="619d3fdbb19ab2a478d85b9fff95576d8f6253c6"
          RUN="44974779776"
          ARTIFACT="14735788333"
          STATUS="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$RUN" --jq '.conclusion')"
          ACTUAL="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$RUN" --jq '.head_sha')"
          test "$STATUS" = success
          test "$ACTUAL" = "$SHA"
          curl -fsSL --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/$ARTIFACT/zip" \
            -o artifact.zip
          mkdir -p release-artifact
          unzip -q artifact.zip -d release-artifact
          cd release-artifact
          sha256sum -c SHA256SUMS
          ARCHIVE="yerbas-4.0.1.6-ubuntu26-${SHA}.tar.gz"
          test -s "$ARCHIVE"
          test "$(tar -xOf "$ARCHIVE" yerbas-build/build-info.txt | sed -n 's/^commit=//p' | head -1)" = "$SHA"
          tar -tzf "$ARCHIVE" > archive-contents.txt
          grep -Fxq 'yerbas-build/yerbasd' archive-contents.txt
          grep -Fxq 'yerbas-build/yerbas-cli' archive-contents.txt
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Publish isolated diagnostic prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          cd release-artifact
          TAG="v4.0.1.6-prune-verify-619d3fdb"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; refusing overwrite"
            exit 1
          fi
          gh release create "$TAG" "$ARCHIVE" "$ARCHIVE.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "619d3fdbb19ab2a478d85b9fff95576d8f6253c6" \
            --title "Yerbas 4.0.1.6 pruning evidence verifier pilot (Ubuntu 26)" \
            --prerelease \
            --notes "Read-only quorum verifyprunedevidence diagnostic pilot. Exact build commit 619d3fdbb19ab2a478d85b9fff95576d8f6253c6, requires GitHub Actions run 44974779776 success. Run only on the existing isolated compacted snapshot; do not deploy to live smartnodes."
