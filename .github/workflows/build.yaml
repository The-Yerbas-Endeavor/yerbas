name: Yerbas Build and Tests

on:
  push:
    branches: [dev, main, '4.X', '4.*']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yerbas-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_JOBS: '2'
  FALLBACK_DOWNLOAD_PATH: https://bitcoincore.org/depends-sources

jobs:
  build:
    name: ${{ matrix.platform.name }} Build
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: ${{ matrix.platform.id == 'win64' && 240 || 120 }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Ubuntu 22
            id: ubuntu22
            runner: ubuntu-22.04
            host: x86_64-pc-linux-gnu
            extension: ''
          - name: Ubuntu 24
            id: ubuntu24
            runner: ubuntu-24.04
            host: x86_64-pc-linux-gnu
            extension: ''
          - name: Ubuntu 26
            id: ubuntu26
            runner: ubuntu-26.04
            host: x86_64-pc-linux-gnu
            extension: ''
          - name: Ubuntu 24 ARM64
            id: ubuntu24-arm64
            runner: ubuntu-24.04-arm
            host: aarch64-linux-gnu
            extension: ''
          - name: macOS 15 Intel
            id: macos15-intel
            runner: macos-15-intel
            host: x86_64-apple-darwin24
            extension: ''
          - name: Windows 64-bit
            id: win64
            runner: ubuntu-26.04
            host: x86_64-w64-mingw32
            extension: .exe
    env:
      HOST_TRIPLE: ${{ matrix.platform.host }}
      BINARY_EXTENSION: ${{ matrix.platform.extension }}
      PLATFORM_ID: ${{ matrix.platform.id }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool \
            autotools-dev pkg-config curl ca-certificates python3 bsdextrautils cmake zip
          if [[ "$HOST_TRIPLE" == x86_64-w64-mingw32 ]]; then
            sudo apt-get install -y g++-mingw-w64-x86-64
            sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
            sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
          fi

      - name: Install Ubuntu Qt development tools
        if: matrix.platform.id == 'ubuntu26'
        run: |
          sudo apt-get install -y qt6-base-dev qt6-base-dev-tools qt6-5compat-dev \
            qt6-tools-dev-tools qt6-qpa-plugins libgl-dev
          pkg-config --atleast-version=6.8 Qt6Core Qt6Core5Compat Qt6Test

      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: |
          brew install autoconf automake libtool pkg-config cmake coreutils gnu-sed make
          for formula in coreutils gnu-sed make; do
            echo "$(brew --prefix "$formula")/libexec/gnubin" >> "$GITHUB_PATH"
          done

      - name: Check Windows packaging logic
        if: matrix.platform.id == 'win64'
        run: python3 -m unittest discover -s contrib/windeploy/tests -v

      - name: Cache dependency sources and packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            depends/sources
            depends/built
          key: depends-${{ matrix.platform.id }}-${{ hashFiles('depends/Makefile', 'depends/**/*.mk', 'depends/patches/**', 'depends/config.site.in') }}
          restore-keys: |
            depends-${{ matrix.platform.id }}-

      - name: Build pinned dependencies
        run: |
          set -euo pipefail
          mkdir -p ci-logs
          extra_args=()
          if [[ "$RUNNER_OS" == macOS ]]; then
            extra_args+=(OSX_MIN_VERSION=11.0)
          fi
          if [[ "$PLATFORM_ID" == ubuntu26 ]]; then
            extra_args+=(USE_SYSTEM_QT=1)
          elif [[ "$PLATFORM_ID" != win64 ]]; then
            extra_args+=(NO_QT=1)
          fi
          make -C depends -j"$BUILD_JOBS" HOST="$HOST_TRIPLE" NO_UPNP=1 "${extra_args[@]}" \
            2>&1 | tee ci-logs/depends.log

      - name: Configure with wallet and tests enabled
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == macOS ]]; then
            export CXXFLAGS="-O2 -g1 -Wno-enum-constexpr-conversion -D_LIBCPP_ENABLE_CXX17_REMOVED_UNARY_BINARY_FUNCTION"
          fi
          gui_args=(--without-gui)
          if [[ "$PLATFORM_ID" == win64 || "$PLATFORM_ID" == ubuntu26 ]]; then
            gui_args=(--with-gui=qt6 --with-qrencode --with-qtdbus=no)
          fi
          ./autogen.sh 2>&1 | tee ci-logs/autogen.log
          ./configure --prefix="$PWD/depends/$HOST_TRIPLE" \
            "${gui_args[@]}" --without-miniupnpc --disable-bench --enable-wallet --enable-tests \
            2>&1 | tee ci-logs/configure.log

      - name: Build binaries and unit tests
        run: |
          set -euo pipefail
          make -j"$BUILD_JOBS" 2>&1 | tee ci-logs/build.log

      - name: Test wallet.dat-only asset recovery
        if: matrix.platform.id == 'ubuntu26'
        timeout-minutes: 15
        run: |
          set -euo pipefail
          python3 ci/test-wallet-asset-restore.py "$PWD/src/yerbasd" \
            --workdir "$PWD/ci-logs/asset-restore" 2>&1 | tee ci-logs/asset-restore.log

      - name: Test transaction utility
        if: matrix.platform.id != 'win64'
        run: |
          python3 test/util/bitcoin-util-test.py --binary "$PWD/src/yerbas-tx"
          python3 ci/test-yerbas-tx.py "$PWD/src/yerbas-tx"

      - name: Collect binaries and checksums
        run: |
          set -euo pipefail
          mkdir -p artifacts
          if [[ "$PLATFORM_ID" == win64 ]]; then
            python3 contrib/windeploy/package.py --depends "depends/$HOST_TRIPLE" \
              --output package --tests-output test-binaries
          else
            mkdir -p package/bin test-binaries
            for name in yerbasd yerbas-cli yerbas-tx; do
              install -m755 "src/${name}${BINARY_EXTENSION}" package/bin/
            done
            install -m755 "src/test/test_yerbas${BINARY_EXTENSION}" test-binaries/
            if [[ "$PLATFORM_ID" == ubuntu26 ]]; then
              # Copy real executables when libtool generated launcher scripts.
              for entry in "src/qt/yerbas-qt:package/bin" "src/qt/test/test_yerbas-qt:test-binaries"; do
                source="${entry%%:*}"
                destination="${entry#*:}"
                real="$(dirname "$source")/.libs/$(basename "$source")"
                if [[ -f "$real" ]]; then source="$real"; fi
                install -m755 "$source" "$destination/"
              done
              printf '%s\n' 'Ubuntu 26 Qt wallet: requires the Ubuntu Qt 6 runtime.' \
                'Install: sudo apt-get install libqt6widgets6 libqt6network6 libqt6core5compat6 qt6-qpa-plugins' \
                > package/README-Qt.txt
            fi
          fi
          {
            echo "commit=$GITHUB_SHA"
            cat build.properties
            echo "host=$HOST_TRIPLE"
          } > package/build-info.txt
          (
            cd package
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          )
          archive="yerbas-${PLATFORM_ID}-${GITHUB_SHA}"
          if [[ "$BINARY_EXTENSION" == .exe ]]; then
            (cd package && zip -r "../artifacts/$archive.zip" .)
          else
            tar -czf "artifacts/$archive.tar.gz" -C package .
          fi
          (cd artifacts && sha256sum yerbas-* > SHA256SUMS)

      - name: Upload binaries
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: yerbas-${{ matrix.platform.id }}-binaries
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

      - name: Upload test executable
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: yerbas-${{ matrix.platform.id }}-test-executable
          path: test-binaries/
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: yerbas-${{ matrix.platform.id }}-build-logs
          path: |
            ci-logs/
            config.log
            depends/work/**/cmake_bootstrap.log
            depends/work/**/config.log
            depends/work/**/CMakeConfigureLog.yaml
          if-no-files-found: warn
          retention-days: 14

  test:
    name: ${{ matrix.platform.name }} Tests
    needs: build
    # Still test artifacts from successful platforms if another build fails.
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Ubuntu 22
            id: ubuntu22
            runner: ubuntu-22.04
            binary: test_yerbas
          - name: Ubuntu 24
            id: ubuntu24
            runner: ubuntu-24.04
            binary: test_yerbas
          - name: Ubuntu 26
            id: ubuntu26
            runner: ubuntu-26.04
            binary: test_yerbas
          - name: Ubuntu 24 ARM64
            id: ubuntu24-arm64
            runner: ubuntu-24.04-arm
            binary: test_yerbas
          - name: macOS 15 Intel
            id: macos15-intel
            runner: macos-15-intel
            binary: test_yerbas
          - name: Windows 64-bit
            id: win64
            runner: windows-2022
            binary: test_yerbas.exe
    steps:
      - name: Checkout test runner
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Download test executable
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: yerbas-${{ matrix.platform.id }}-test-executable
          path: test-binaries

      - name: Install Ubuntu Qt test runtime
        if: matrix.platform.id == 'ubuntu26'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libqt6widgets6 libqt6network6 libqt6core5compat6 libqt6test6 qt6-qpa-plugins

      - name: Restore executable permission
        if: runner.os != 'Windows'
        shell: bash
        run: chmod +x test-binaries/test_yerbas

      - name: Run every enabled unit suite
        shell: bash
        run: python ci/run-unit-tests.py "test-binaries/${{ matrix.platform.binary }}" --output test-results --timeout 180 --no-step-summary

      - name: Run Ubuntu Qt wallet and asset viewer tests
        timeout-minutes: 10
        if: ${{ !cancelled() && matrix.platform.id == 'ubuntu26' }}
        shell: bash
        env:
          QT_QPA_PLATFORM: minimal
        run: |
          set -euo pipefail
          mkdir -p test-results
          chmod +x test-binaries/test_yerbas-qt
          ./test-binaries/test_yerbas-qt 2>&1 | tee test-results/qt-tests.log

      - name: Run Windows Qt and asset viewer tests
        timeout-minutes: 10
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results
          ./test-binaries/test_yerbas-qt.exe 2>&1 | tee test-results/qt-tests.log

      - name: Test Windows transaction utility and wallet recovery
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          python test/util/bitcoin-util-test.py --binary "$PWD/test-binaries/yerbas-tx.exe"
          python ci/test-yerbas-tx.py "$PWD/test-binaries/yerbas-tx.exe"
          python ci/test-wallet-asset-restore.py "$PWD/test-binaries/yerbasd.exe" --encrypted --workdir "$PWD/test-results/asset-restore"

      - name: Check Windows wallet opens its version dialog
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        timeout-minutes: 2
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force test-results | Out-Null
          $walletProcess = Start-Process ./test-binaries/yerbas-qt.exe -ArgumentList '-version','-lang=en' -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(45)
            do {
              Start-Sleep -Milliseconds 500
              $walletProcess.Refresh()
              if ($walletProcess.HasExited) { throw "Wallet exited before opening: $($walletProcess.ExitCode)" }
              if ($walletProcess.MainWindowTitle -like 'About Yerbas*') {
                "Opened $($walletProcess.MainWindowTitle)" | Tee-Object test-results/qt-startup.log
                break
              }
            } while ((Get-Date) -lt $deadline)
            if ($walletProcess.MainWindowTitle -notlike 'About Yerbas*') { throw 'Wallet version dialog did not open' }
          } finally {
            if (-not $walletProcess.HasExited) { Stop-Process -Id $walletProcess.Id -Force }
          }

      - name: Upload test reports and logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: yerbas-${{ matrix.platform.id }}-test-results
          path: test-results/
          if-no-files-found: error
          retention-days: 14

      - name: Upload compact unit summary
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: yerbas-${{ matrix.platform.id }}-unit-summary
          path: test-results/summary.json
          if-no-files-found: warn
          retention-days: 14

  summary:
    name: Test summary
    needs: test
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout summary renderer
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Download compact unit summaries
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: yerbas-*-unit-summary
          path: summaries
      - name: Publish one platform comparison
        if: always()
        run: python3 ci/summarize-unit-tests.py summaries >> "$GITHUB_STEP_SUMMARY"
