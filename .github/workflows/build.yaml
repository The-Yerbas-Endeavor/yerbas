name: Yerbas Build and Tests

on:
  push:
    branches: [dev, main, "4.0.0.3", "4.0.0.4", "4.0.0.6"]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yerbas-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_JOBS: '2'
  FALLBACK_DOWNLOAD_PATH: https://bitcoincore.org/depends-sources

jobs:
  build:
    name: ${{ matrix.platform.name }} Build
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Ubuntu 22
            id: ubuntu22
            runner: ubuntu-22.04
            host: x86_64-pc-linux-gnu
            extension: ''
          - name: Ubuntu 24
            id: ubuntu24
            runner: ubuntu-24.04
            host: x86_64-pc-linux-gnu
            extension: ''
          - name: Ubuntu 26
            id: ubuntu26
            runner: ubuntu-26.04
            host: x86_64-pc-linux-gnu
            extension: ''
          - name: Ubuntu 24 ARM64
            id: ubuntu24-arm64
            runner: ubuntu-24.04-arm
            host: aarch64-linux-gnu
            extension: ''
          - name: macOS 15 Intel
            id: macos15-intel
            runner: macos-15-intel
            host: x86_64-apple-darwin24
            extension: ''
          - name: Windows 64-bit
            id: win64
            runner: ubuntu-26.04
            host: x86_64-w64-mingw32
            extension: .exe
    env:
      HOST_TRIPLE: ${{ matrix.platform.host }}
      BINARY_EXTENSION: ${{ matrix.platform.extension }}
      PLATFORM_ID: ${{ matrix.platform.id }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool \
            autotools-dev pkg-config curl ca-certificates python3 bsdextrautils cmake zip
          if [[ "$HOST_TRIPLE" == x86_64-w64-mingw32 ]]; then
            sudo apt-get install -y g++-mingw-w64-x86-64
            sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
            sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
          fi

      - name: Install native Linux Qt build dependencies
        if: runner.os == 'Linux' && matrix.platform.id != 'win64' && matrix.platform.id != 'ubuntu26'
        run: |
          sudo apt-get install -y libfontconfig1-dev libssl-dev libx11-dev libx11-xcb-dev \
            libxext-dev libxfixes-dev libxi-dev libxrender-dev libxcb1-dev libxcb-cursor-dev \
            libxcb-glx0-dev libxcb-icccm4-dev libxcb-image0-dev libxcb-keysyms1-dev libxcb-util-dev \
            libxcb-randr0-dev libxcb-render-util0-dev libxcb-shape0-dev libxcb-shm0-dev \
            libxcb-sync-dev libxcb-xfixes0-dev libxcb-xinerama0-dev libxcb-xkb-dev \
            libxkbcommon-dev libxkbcommon-x11-dev

      - name: Install Ubuntu Qt development tools
        if: matrix.platform.id == 'ubuntu26'
        run: |
          sudo apt-get install -y qt6-base-dev qt6-base-dev-tools qt6-5compat-dev \
            qt6-tools-dev-tools qt6-qpa-plugins libgl-dev
          pkg-config --atleast-version=6.8 Qt6Core Qt6Core5Compat Qt6Test

      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: |
          brew install autoconf automake libtool pkg-config cmake coreutils gnu-sed make
          for formula in coreutils gnu-sed make; do
            echo "$(brew --prefix "$formula")/libexec/gnubin" >> "$GITHUB_PATH"
          done

      - name: Check native Qt packaging logic
        run: python3 -m unittest discover -s ci/tests -v

      - name: Check Windows packaging logic
        if: matrix.platform.id == 'win64'
        run: python3 -m unittest discover -s contrib/windeploy/tests -v

      - name: Cache dependency sources and packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            depends/sources
            depends/built
          key: depends-${{ matrix.platform.id }}-${{ hashFiles('depends/Makefile', 'depends/**/*.mk', 'depends/patches/**', 'depends/config.site.in') }}
          restore-keys: |
            depends-${{ matrix.platform.id }}-

      - name: Build pinned dependencies
        run: |
          set -euo pipefail
          mkdir -p ci-logs
          extra_args=()
          if [[ "$RUNNER_OS" == macOS ]]; then
            extra_args+=(OSX_MIN_VERSION=11.0)
          fi
          if [[ "$PLATFORM_ID" != win64 ]]; then
            extra_args+=(USE_SYSTEM_QT=1)
          fi
          make -C depends -j"$BUILD_JOBS" HOST="$HOST_TRIPLE" NO_UPNP=1 "${extra_args[@]}" \
            2>&1 | tee ci-logs/depends.log

      - name: Cache native desktop Qt
        if: matrix.platform.id != 'win64' && matrix.platform.id != 'ubuntu26'
        id: native-qt-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: qt-native
          key: native-qt-${{ matrix.platform.id }}-${{ hashFiles('ci/build-native-qt.py', 'depends/packages/qt.mk', 'depends/packages/qt5compat.mk', 'depends/packages/native_qttools.mk') }}

      - name: Build and verify native desktop Qt
        if: matrix.platform.id != 'win64' && matrix.platform.id != 'ubuntu26'
        run: |
          set -euo pipefail
          if [[ ! -f qt-native/.complete ]]; then
            python3 ci/build-native-qt.py --prefix "$PWD/qt-native" \
              --cmake "$PWD/depends/$HOST_TRIPLE/native/bin/cmake" --jobs "$BUILD_JOBS" \
              2>&1 | tee ci-logs/native-qt.log
          fi
          export PKG_CONFIG_PATH="$PWD/qt-native/lib/pkgconfig"
          pkg-config --atleast-version=6.8 Qt6Core Qt6Gui Qt6Widgets Qt6Network Qt6Core5Compat Qt6Test
          echo "QT_NATIVE_PREFIX=$PWD/qt-native" >> "$GITHUB_ENV"

      - name: Configure with wallet and tests enabled
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == macOS ]]; then
            export CXXFLAGS="-O2 -g1 -Wno-enum-constexpr-conversion -D_LIBCPP_ENABLE_CXX17_REMOVED_UNARY_BINARY_FUNCTION"
          fi
          gui_args=(--with-gui=qt6 --with-qrencode --with-qtdbus=no)
          ./autogen.sh 2>&1 | tee ci-logs/autogen.log
          ./configure --prefix="$PWD/depends/$HOST_TRIPLE" \
            "${gui_args[@]}" --without-miniupnpc --disable-bench --enable-wallet --enable-tests \
            2>&1 | tee ci-logs/configure.log

      - name: Build binaries and unit tests
        run: |
          set -euo pipefail
          make -j"$BUILD_JOBS" 2>&1 | tee ci-logs/build.log

      - name: Test wallet.dat-only asset recovery
        if: matrix.platform.id == 'ubuntu26'
        timeout-minutes: 10
        run: |
          set -euo pipefail
          python3 ci/test-wallet-asset-restore.py "$PWD/src/yerbasd" \
            --workdir "$PWD/ci-logs/asset-restore" 2>&1 | tee ci-logs/asset-restore.log

      - name: Test signed LOW_LLMQ transactions and replay audit
        if: matrix.platform.id == 'ubuntu26'
        timeout-minutes: 10
        run: |
          set -euo pipefail
          python3 -m unittest discover -s contrib/llmq -p test_extract_replay_fixture.py -v \
            2>&1 | tee ci-logs/replay-extraction-tests.log
          python3 test/functional/feature_llmq_manual_recovery.py \
            --tmpdir="$RUNNER_TEMP/yerbas-signed-spork-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            2>&1 | tee ci-logs/signed-spork-transactions.log

      - name: Collect binaries and checksums
        run: |
          set -euo pipefail
          mkdir -p artifacts
          if [[ "$PLATFORM_ID" == win64 ]]; then
            python3 contrib/windeploy/package.py --depends "depends/$HOST_TRIPLE" \
              --output package --tests-output test-binaries
          else
            mkdir -p package/bin test-binaries
            for name in yerbasd yerbas-cli; do
              install -m755 "src/${name}${BINARY_EXTENSION}" package/bin/
            done
            install -m755 "src/test/test_yerbas${BINARY_EXTENSION}" test-binaries/
            if [[ "$PLATFORM_ID" == ubuntu26 ]]; then
              # Copy real executables when libtool generated launcher scripts.
              for entry in "src/qt/yerbas-qt:package/bin" "src/qt/test/test_yerbas-qt:test-binaries"; do
                source="${entry%%:*}"
                destination="${entry#*:}"
                real="$(dirname "$source")/.libs/$(basename "$source")"
                if [[ -f "$real" ]]; then source="$real"; fi
                install -m755 "$source" "$destination/"
              done
              printf '%s\n' 'Ubuntu 26 Qt wallet: requires the Ubuntu Qt 6 runtime.' \
                'Install: sudo apt-get install libqt6widgets6 libqt6network6 libqt6core5compat6 qt6-qpa-plugins' \
                > package/README-Qt.txt
            else
              python3 ci/package-native-qt.py --prefix "$QT_NATIVE_PREFIX"
            fi
            # Preserve executable modes and library symlinks through artifact upload.
            tar -czf test-runtime.tar.gz -C test-binaries .
            rm -rf test-binaries
            mkdir test-binaries
            mv test-runtime.tar.gz test-binaries/
          fi
          {
            echo "commit=$GITHUB_SHA"
            cat build.properties
            echo "host=$HOST_TRIPLE"
          } > package/build-info.txt
          (
            cd package
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          )
          version="$(sed -n 's/^release-version=//p' build.properties)"
          archive="yerbas-${version}-${PLATFORM_ID}-${GITHUB_SHA}"
          if [[ "$BINARY_EXTENSION" == .exe ]]; then
            (cd package && zip -r "../artifacts/$archive.zip" .)
          else
            tar -czf "artifacts/$archive.tar.gz" -C package .
          fi
          (cd artifacts && sha256sum yerbas-* > SHA256SUMS)

      - name: Upload binaries
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: yerbas-${{ matrix.platform.id }}-binaries
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

      - name: Upload test executable
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: yerbas-${{ matrix.platform.id }}-test-executable
          path: test-binaries/
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: yerbas-${{ matrix.platform.id }}-build-logs
          path: |
            ci-logs/
            config.log
            depends/work/**/cmake_bootstrap.log
            depends/work/**/config.log
            depends/work/**/CMakeConfigureLog.yaml
            qt-native-work/**/CMakeConfigureLog.yaml
            qt-native-work/**/CMakeError.log
            qt-native-work/**/config.summary
          if-no-files-found: warn
          retention-days: 14

  test:
    name: ${{ matrix.platform.name }} Tests
    needs: build
    # Still test artifacts from successful platforms if another build fails.
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Ubuntu 22
            id: ubuntu22
            runner: ubuntu-22.04
            binary: test_yerbas
          - name: Ubuntu 24
            id: ubuntu24
            runner: ubuntu-24.04
            binary: test_yerbas
          - name: Ubuntu 26
            id: ubuntu26
            runner: ubuntu-26.04
            binary: test_yerbas
          - name: Ubuntu 24 ARM64
            id: ubuntu24-arm64
            runner: ubuntu-24.04-arm
            binary: test_yerbas
          - name: macOS 15 Intel
            id: macos15-intel
            runner: macos-15-intel
            binary: test_yerbas
          - name: Windows 64-bit
            id: win64
            runner: windows-2022
            binary: test_yerbas.exe
    steps:
      - name: Checkout test runner
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Download test executable
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: yerbas-${{ matrix.platform.id }}-test-executable
          path: test-binaries

      - name: Extract native test runtime
        if: runner.os != 'Windows'
        shell: bash
        run: tar -xzf test-binaries/test-runtime.tar.gz -C test-binaries

      - name: Install native Linux Qt test runtime
        if: runner.os == 'Linux' && matrix.platform.id != 'ubuntu26'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0

      - name: Install Ubuntu Qt test runtime
        if: matrix.platform.id == 'ubuntu26'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libqt6widgets6 libqt6network6 libqt6core5compat6 libqt6test6 qt6-qpa-plugins

      - name: Restore executable permission
        if: runner.os != 'Windows'
        shell: bash
        run: chmod +x test-binaries/test_yerbas

      - name: Run every enabled unit suite
        shell: bash
        run: python ci/run-unit-tests.py "test-binaries/${{ matrix.platform.binary }}" --output test-results --timeout 180

      - name: Run native Qt wallet and asset viewer tests
        timeout-minutes: 10
        if: ${{ !cancelled() && runner.os != 'Windows' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results
          if [[ "$RUNNER_OS" == macOS ]]; then
            ./test-binaries/test_yerbas-qt.app/Contents/MacOS/test_yerbas-qt 2>&1 | tee test-results/qt-tests.log
          elif [[ "${{ matrix.platform.id }}" == ubuntu26 ]]; then
            QT_QPA_PLATFORM=minimal ./test-binaries/test_yerbas-qt 2>&1 | tee test-results/qt-tests.log
          else
            QT_QPA_PLATFORM=minimal ./test-binaries/bin/test_yerbas-qt 2>&1 | tee test-results/qt-tests.log
          fi

      - name: Run Windows Qt and asset viewer tests
        timeout-minutes: 10
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results
          ./test-binaries/test_yerbas-qt.exe 2>&1 | tee test-results/qt-tests.log

      - name: Check Windows wallet opens its version dialog
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        timeout-minutes: 2
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force test-results | Out-Null
          $walletProcess = Start-Process ./test-binaries/yerbas-qt.exe -ArgumentList '-version','-lang=en' -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(45)
            do {
              Start-Sleep -Milliseconds 500
              $walletProcess.Refresh()
              if ($walletProcess.HasExited) { throw "Wallet exited before opening: $($walletProcess.ExitCode)" }
              if ($walletProcess.MainWindowTitle -like 'About Yerbas*') {
                "Opened $($walletProcess.MainWindowTitle)" | Tee-Object test-results/qt-startup.log
                break
              }
            } while ((Get-Date) -lt $deadline)
            if ($walletProcess.MainWindowTitle -notlike 'About Yerbas*') { throw 'Wallet version dialog did not open' }
          } finally {
            if (-not $walletProcess.HasExited) { Stop-Process -Id $walletProcess.Id -Force }
          }

      - name: Upload test reports and logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: yerbas-${{ matrix.platform.id }}-test-results
          path: test-results/
          if-no-files-found: error
          retention-days: 14
